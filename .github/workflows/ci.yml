name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install QA and build tooling
        run: >
          python -m pip install
          "build==1.6.0"
          "twine==7.0.0"
          "pytest==9.1.1"
          "pytest-httpserver==1.1.5"
          "Werkzeug==3.1.8"

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify artifact inventory and package metadata
        run: >
          python -c "import pathlib, subprocess, sys, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          dist = pathlib.Path('dist');
          artifacts = [dist / f'apiwells-{version}-py3-none-any.whl', dist / f'apiwells-{version}.tar.gz'];
          assert {p.name for p in dist.iterdir()} == {p.name for p in artifacts}, 'Unexpected dist inventory';
          assert all(p.is_file() for p in artifacts), 'Missing release artifact';
          print('Expected version:', version);
          subprocess.check_call([sys.executable, '-m', 'twine', 'check', '--strict', *map(str, artifacts)])"

      - name: Install built wheel
        run: >
          python -c "import pathlib, subprocess, sys;
          wheels = list(pathlib.Path('dist').glob('*.whl'));
          assert len(wheels) == 1, 'Expected exactly one wheel';
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"

      - name: Verify installed package
        run: |
          python -m pip check
          python -c "import apiwells, pathlib, sysconfig, tomllib; expected = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; imported = pathlib.Path(apiwells.__file__).resolve(); print('Expected version:', expected); print('Installed version:', apiwells.__version__); print('Import path:', imported); assert apiwells.__version__ == expected, 'Installed version mismatch'; assert any(imported.is_relative_to(pathlib.Path(sysconfig.get_path(p)).resolve()) for p in ('purelib', 'platlib')), 'Import must come from installed site-packages'; assert not imported.is_relative_to(pathlib.Path('src').resolve()), 'Source checkout import is not accepted'"
          apiwells --version
          apiwells --help
          apiwells doctor --help

      - name: Unit tests
        run: >
          python -m pytest
          tests
          --ignore=tests/integration
          -q

      - name: Mock integration and Basic CLI flow
        run: >
          python -m pytest
          tests/integration
          -q
